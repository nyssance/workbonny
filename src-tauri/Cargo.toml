[package]
name = "workbonny"
version = "0.1.0"
edition = "2024"

[lib]
name = "alwith_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workbonny"
path = "src/main.rs"

[features]
# Debug-only automation bridge for the tauri-hasgard CLI and MCP server; release builds never include it.
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
notify = "8"
sha2 = "0.11"
hex = "0.4"
alwith-desktop-shell = "0.6"
alwith-api = "0.6"
alwith-chat = "0.6"
alwith-store = "0.6"
alwith-auth = "0.6"
alwith-extension = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-http = "3.0.0-alpha.3"
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-hasgard = { version = "0.6", optional = true }
tauri-runtime-wry = "3.0.0-alpha.5"
tokio = { version = "1", features = ["full"] }

# Keep local image decoding responsive in development without optimizing the whole app.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3

[dev-dependencies]
tempfile = "3"
