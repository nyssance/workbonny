[package]
name = "workbonny"
version = "0.1.0"
edition = "2024"

[lib]
name = "workbonny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "3.0.0-alpha.4"

[dependencies]
alwith-api = { path = "../node_modules/@alwith/api/rust" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-plugin-log = "3.0.0-alpha.3"
tauri-runtime-wry = "3.0.0-alpha.5"
tokio = { version = "1", features = ["full"] }
